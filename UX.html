  <script>
    // Function to fetch the image files from the GitHub repository
    function fetchImages() {
      const apiUrl = 'https://api.github.com/repos/nemwang/nemwang.github.io/images/gallery';
      fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
          const imageFiles = data.filter(file => file.type === 'file' && /\.(jpe?g|png|gif|bmp)$/i.test(file.name));
          const gallery = document.querySelector('.gallery');
          imageFiles.forEach(file => {
            const imageUrl = file.download_url;
            const imageName = file.name.split('.')[0];
            const galleryItem = document.createElement('div');
            galleryItem.className = 'gallery-item';
            galleryItem.innerHTML = `
              <img src="${imageUrl}" alt="${imageName}">
              <div class="image-name">${imageName}</div>
            `;
            gallery.appendChild(galleryItem);
          });
        })
        .catch(error => {
          console.log(error);
        });
    }

    // Fetch and display the images
    fetchImages();
  </script>
