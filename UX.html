    <script>
      // Function to load images from the directory
      function loadImages() {
        const directory = "images/gallery/";
        const gallery = document.getElementById("image-gallery");
    
        // Fetch the list of image files from the directory
        fetch(directory)
          .then(response => response.text())
          .then(data => {
            // Parse the HTML content of the directory
            const parser = new DOMParser();
            const htmlContent = parser.parseFromString(data, "text/html");
    
            // Get the list of image file names
            const fileNames = Array.from(htmlContent.querySelectorAll("a"))
              .map(a => a.href)
              .filter(href => href.match(/\.(jpe?g|png|gif)$/i))
              .map(href => href.replace(/^.*[\\/]/, ""));
    
            // Generate the HTML code for each image
            fileNames.forEach(fileName => {
              const imagePath = directory + fileName;
              const imageElement = document.createElement("img");
              imageElement.src = imagePath;
    
              const galleryItem = document.createElement("div");
              galleryItem.className = "gallery-item";
              galleryItem.appendChild(imageElement);
    
              const imageName = document.createElement("div");
              imageName.className = "image-name";
              imageName.textContent = fileName.replace(/\.[^.]+$/, "");
              galleryItem.appendChild(imageName);
    
              gallery.appendChild(galleryItem);
            });
          })
          .catch(error => {
            console.log("Error loading images:", error);
          });
      }
    
      // Call the function to load images when the page is loaded
      window.addEventListener("load", loadImages);
    </script>
